name: ReaderRebuild
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.0.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  ReaderCoreBridge:
    type: framework
    platform: iOS
    sources: [Sources/ReaderCoreBridge]
    dependencies:
      - framework: .build/ReaderCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny.rebuild.m1.bridge
  ReaderHost:
    type: framework
    platform: iOS
    sources: [Sources/ReaderHost]
    dependencies:
      - target: ReaderCoreBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny.rebuild.m1.host
  ReaderDesign:
    type: framework
    platform: iOS
    sources:
      - Sources/ReaderDesign
      - path: Resources/reader_design/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/reader_design/Icons.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny.rebuild.m1.design
  ReaderApp:
    type: application
    platform: iOS
    info:
      path: .build/ReaderApp-Info.plist
      properties:
        UIBackgroundModes: [audio]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    sources:
      - Sources/ReaderApp
      - path: Resources/reader_ebook_runtime
        type: folder
        buildPhase: resources
    dependencies:
      - target: ReaderCoreBridge
      - target: ReaderHost
      - target: ReaderDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny.rebuild.m1
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  ReaderAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Goldens/Baselines, Loopback]
      - path: Tests/Goldens/Baselines
        type: folder
        buildPhase: resources
      - path: Scripts/pins.json
        buildPhase: resources
    dependencies:
      - target: ReaderApp
      - target: ReaderCoreBridge
      - target: ReaderHost
      - target: ReaderDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny.rebuild.m1.tests
  ReaderAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ReaderApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny.rebuild.m1.ui-tests
        TEST_TARGET_NAME: ReaderApp
schemes:
  ReaderRebuild:
    build:
      targets:
        ReaderApp: all
        ReaderAppTests: [test]
        ReaderAppUITests: [test]
    test:
      targets: [ReaderAppTests, ReaderAppUITests]
      parallelizable: false
