name: Reader
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
targets:
  Reader:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Vendor/ReaderCoreClient/ReaderCoreClient.swift
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny
        PRODUCT_NAME: Reader
        INFOPLIST_FILE: Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
    dependencies:
      - framework: .build/ReaderCore.xcframework
        embed: false
        codeSign: false
      - sdk: libz.tbd
  ReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReaderRuntimeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Reader.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Reader
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Reader
  ReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ReaderUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Reader
    dependencies:
      - target: Reader
schemes:
  Reader:
    build:
      targets:
        Reader: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: ReaderTests
          parallelizable: false
        - name: ReaderUITests
          parallelizable: false
    archive:
      config: Release
