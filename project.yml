name: ReaderRebuild
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.0.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  ReaderCoreBridge:
    type: framework
    platform: iOS
    sources: [Sources/ReaderCoreBridge]
    dependencies:
      - framework: .build/ReaderCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny.rebuild.m1.bridge
  ReaderHost:
    type: framework
    platform: iOS
    sources: [Sources/ReaderHost]
    dependencies:
      - target: ReaderCoreBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny.rebuild.m1.host
  ReaderDesign:
    type: framework
    platform: iOS
    sources: [Sources/ReaderDesign]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny.rebuild.m1.design
  ReaderApp:
    type: application
    platform: iOS
    sources:
      - Sources/ReaderApp
      - path: Resources/reader_ebook_runtime
        type: folder
        buildPhase: resources
    dependencies:
      - target: ReaderCoreBridge
      - target: ReaderHost
      - target: ReaderDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny.rebuild.m1
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  ReaderAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ReaderApp
      - target: ReaderCoreBridge
      - target: ReaderHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reader.minliny.rebuild.m1.tests
schemes:
  ReaderRebuild:
    build:
      targets:
        ReaderApp: all
        ReaderAppTests: [test]
    test:
      targets: [ReaderAppTests]
      parallelizable: false
